services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: jobtracker
      POSTGRES_USER: jobtracker_user
      POSTGRES_PASSWORD: changeme123
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
  api:
    build: ./api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ~/.aws:/root/.aws:ro
    depends_on:
      - db    
  worker:
    build: ./worker
    environment:
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    volumes:
      - ~/.aws:/root/.aws:ro
    depends_on:
      - db  


volumes:
  pgdata: